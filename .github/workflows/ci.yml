name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'GitOps/**'

  push:
    branches:
      - main
    paths-ignore:
      - 'GitOps/**'

permissions:
  contents: read

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Application/package-lock.json

      - name: Install dependencies
        working-directory: Application
        run: npm ci

      - name: Run tests
        working-directory: Application
        run: npm test

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: Terraform
          framework: terraform
          soft_fail: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test
      - security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f Docker/Dockerfile \
            -t devops-assignment-api:${{ github.sha }} \
            .

      - name: Verify Docker image
        run: |
          docker image inspect devops-assignment-api:${{ github.sha }}