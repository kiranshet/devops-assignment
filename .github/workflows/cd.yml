name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
 contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-assignment-dev-api
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  build-and-push:
    name: Build and Push Image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -f Docker/Dockerfile \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            .

      - name: Push image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

  update-staging:
    name: Update Staging GitOps
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update staging image
        run: |
          sed -i \
            "s|image: .*|image: 620893829052.dkr.ecr.ap-south-1.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}|" \
            GitOps/staging/rollout.yaml

      - name: Commit GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add GitOps/staging/rollout.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "chore: deploy ${IMAGE_TAG} to staging"

          git pull --rebase origin main
          git push